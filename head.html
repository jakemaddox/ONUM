  <link rel='stylesheet' href='cantarell.css'>
  <style>
    :root {
      font-size: 150%; 
      font-weight: 450; 
      font-variant-numeric: oldstyle-nums;
      line-height: 1.4;
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      font-size: 300%;
      font-weight: 300;
      text-align: center;
